<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Área de Login</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
        <div class="highleft-button">
          <a href='loginpage_en.html' class="button lang-button" style=text-decoration:none>PT/BR</a>
        </div>
        <div class="highright-button">
          <input type="checkbox" id="theme-toggle" style="display: none;">
            <label for="theme-toggle" class="theme-label">
              <img src="light-bulb.png" alt="Mudar para tema claro" class="icon-light">
              <img src="black-bulb.png" alt="Mudar para tema escuro" class="icon-dark">
            </label>
        </div>
        <div class="center">
            <h2>Área de Login</h2>
            <div class="img-card">
                <b>Acesse a sua conta</b>
                <br><br>
                <div class="form">
                  <div class="input-field">
                    <label>Email</label>
                    <input type="email" placeholder="example@example.com" name="login" required>
                  </div>
                  <div class="input-field">
                  <label>Senha</label>
                  <input type="password" placeholder="**********" name="password">
                  </div>
                </div>
                <br>
                <a href="user_home.html" target="_blank" class="buttons-action" style="text-decoration: none;">Entrar</a>
                <a href="registration.html" target="_blank" class="buttons-action" style="text-decoration: none;">Cadastre-se</a>
            </div>
            <br><br><br><br><br><br>
            <div class="bottom-note">
            <b>LITRÄO ® All Rights Reserved.</b>
            </div>
        </div>
        </div>
        

    </main>
    <script src="index.js"></script>
  </body>
</html>
