<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <!-- CSS -->
    <link rel="stylesheet" href="stylesheet.css">
    <title>Registro</title>
</head>

<body>
    <div class="container">
        <h1>Formulário de Cadastro</h1>
        <br><br>
        <b>Preencha os dados abaixo para criar sua conta.</b>
        <br><br>
        <form action="#">
            <div class="form">
                <div class="input-field">
                    <label>1. Nome completo</label>
                    <input type="text" placeholder="Insira o seu nome" required>
                </div>
                <div class="input-field">
                    <label>2. Data de Nascimento</label>
                    <input type="date" placeholder="dd/mm/aaaa" required>
                </div>
                <div class="input-field">
                    <label>3. CPF</label>
                    <input type="number" placeholder="000.000.000-00" required>
                </div>
                <div class="input-field">
                    <label>4. Email</label>
                    <input type="text" placeholder="Insira o seu Email" required>
                </div>
                <div class="input-field">
                    <label>5. Telefone</label>
                    <input type="number" placeholder="(00) 000000-0000" required>
                </div>
                <div class="input-field">
                    <label>6. Gênero</label>
                    <select required>
                        <option disabled selected>Selecione seu gênero</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                    </select>
                </div>
                <div class="input-field">
                    <label>7. Ocupação</label>
                    <input type="text" placeholder="Insira sua ocupação." required>
                </div>
                <div class="input-field">
                    <label>8. Endereço</label>
                    <input type="text" placeholder="Rua, número, complemento" required>
                </div>
                <div class="input-field">
                    <label>9. Cidade</label>
                    <input type="text" placeholder="Digite sua cidade" required>
                </div>
                <div class="input-field">
                    <label>10. Estado</label>
                    <select required>
                        <option value=disabled selected>Selecione um estado</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AP">AP</option>
                        <option value="AM">AM</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MT">MT</option>
                        <option value="MS">MS</option>
                        <option value="MG">MG</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PR">PR</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RS">RS</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="SC">SC</option>
                        <option value="SP">SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                    </select>
                </div>
                <div class="input-field">
                    <label>11. Senha</label>
                    <input type="text" placeholder="Insira uma senha" required>
                </div>
                <div class="input-field">
                    <label>12. Confirme sua senha</label>
                    <input type="text" placeholder="Confirme sua senha" required>
                </div>
            </div>
        </form>
        <br><br>
        <button type="button">Finalizar cadastro</button>
    </div>
    <script src="script.js" defer></script>
</body>

</html>
